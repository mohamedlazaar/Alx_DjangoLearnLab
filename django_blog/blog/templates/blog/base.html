{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/styles.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'blog:home' %}">Home</a>
            <a href="{% url 'blog:post_list' %}">Posts</a>
            <form class="search-form" action="{% url 'blog:search' %}" method="get" role="search">
                <input type="search" name="q" placeholder="Search posts..." value="{{ request.GET.q }}">
                <button type="submit">Search</button>
            </form>
            {% if user.is_authenticated %}
              <a href="{% url 'blog:post_create' %}">New Post</a>
              <a href="{% url 'blog:profile' %}">Profile</a>
              <a href="{% url 'blog:logout' %}">Logout</a>
            {% else %}
              <a href="{% url 'blog:login' %}">Login</a>
              <a href="{% url 'blog:register' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; Django Blog</p>
    </footer>
    <script src="{% static 'blog/js/scripts.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
