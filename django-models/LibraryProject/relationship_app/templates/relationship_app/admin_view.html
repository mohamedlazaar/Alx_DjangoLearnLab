<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h1>Admin Dashboard</h1>
    <p>Welcome, Admin! You have full access to manage the library system.</p>
    <div>
        <h2>Admin Capabilities:</h2>
        <ul>
            <li>Manage all users and their roles</li>

            <li>View all system reports</li>
            <li>Configure system settings</li>
        </ul>
    </div>
    <a href="{% url 'logout' %}">Logout</a>
</body>
</html>
